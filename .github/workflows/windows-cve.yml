name: Windows builds (CVE-2026-109618/109619)
run-name: Windows builds of the CVE-2026-109618/109619 patch releases (${{ inputs.releases || 'list' }})

# Builds the patched 7.x/8.x releases (PHP-X.Y.Z-CVE-2026-109618-109619) and the unpatched
# releases (tag php-X.Y.Z) with MSVC, thread-safe and non-thread-safe, runs the fix's checks
# and a test subset on each, and compares patched with unpatched in the summary job.
on:
  push:
    branches: [ci/windows-cve]
    paths: ['.github/workflows/windows-cve.yml', 'ci/**']
  workflow_dispatch:
    inputs:
      releases:
        description: "'list' (ci/releases.txt), a line like '7.4', or releases like '7.4.33 8.1.34'; add ts-only, nts-only or patched-only to narrow"
        required: false
        default: list

permissions:
  contents: read

# a new push or run replaces the one in progress
concurrency:
  group: windows-cve
  cancel-in-progress: true

jobs:
  matrix:
    name: Select releases
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          SELECTION: ${{ inputs.releases || 'list' }}
        run: python3 ci/matrix.py "$SELECTION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      OBJ_DIR: C:\obj
      LOG_DIR: ${{ github.workspace }}\out
      THREAD_SAFE: ${{ matrix.ts == 'ts' && '1' || '0' }}
    steps:
      - name: Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          path: ci-root

      - name: Checkout ${{ matrix.side }} source (${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src
          fetch-depth: 1

      - name: Checkout PHP SDK
        uses: actions/checkout@v4
        with:
          repository: php/php-sdk-binary-tools
          ref: php-sdk-2.3.0
          path: sdk

      - name: Install the ${{ matrix.crt }} toolset (${{ matrix.component }})
        if: matrix.component != ''
        shell: pwsh
        run: |
          & ./ci-root/ci/vs_add.ps1 '${{ matrix.component }}'

      - name: Select the toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $want = '${{ matrix.toolset }}'
          if ($want -eq '14.0') {
            $cl = "${env:ProgramFiles(x86)}\Microsoft Visual Studio 14.0\VC\bin\amd64\cl.exe"
            if (-not (Test-Path $cl)) { Write-Host "VS2015 (v140) compiler not found at $cl"; exit 1 }
            $ts = '14.0'
            # The VS2015 compiler cannot use the newest Windows SDK headers (ucrt\wchar.h calls
            # _mm_loadu_si64, which it does not declare), so pick a Windows 10 SDK, 10.0.19041 or older
            # if there is one, and pass it to vcvarsall.
            $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
            function Find-Sdk {
              Get-ChildItem "$kits\Include" -Directory |
                Where-Object { $_.Name -match '^10\.0\.\d+\.0$' -and
                  (Test-Path "$kits\Lib\$($_.Name)\um\x64\kernel32.lib") -and (Test-Path "$kits\Lib\$($_.Name)\ucrt\x64\ucrt.lib") -and
                  (Test-Path "$($_.FullName)\ucrt\wchar.h") -and
                  -not (Select-String -Path "$($_.FullName)\ucrt\wchar.h" -Pattern '_mm_loadu_si64' -SimpleMatch -Quiet) } |
                Sort-Object { [version]$_.Name }
            }
            Write-Host "Windows SDKs: $((Get-ChildItem "$kits\Include" -Directory).Name -join ', ')"
            $sdks = @(Find-Sdk)
            if (-not $sdks) {
              & ./ci-root/ci/vs_add.ps1 Microsoft.VisualStudio.Component.Windows10SDK.19041
              $sdks = @(Find-Sdk)
            }
            if (-not $sdks) { Write-Host "no Windows SDK usable with VS2015"; exit 1 }
            $old = @($sdks | Where-Object { [version]$_.Name -le [version]'10.0.19041.0' })
            $winsdk = if ($old) { $old[-1].Name } else { $sdks[-1].Name }
            Write-Host "Using Windows SDK $winsdk (usable: $($sdks.Name -join ', '))"
            "WINSDK=$winsdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $dirs = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object { $_.Name -like "$want*" } | Sort-Object Name
            Write-Host "MSVC toolsets: $((Get-ChildItem "$vs\VC\Tools\MSVC" -Directory).Name -join ', ')"
            if (-not $dirs) { Write-Host "no $want* toolset installed"; exit 1 }
            $ts = $dirs[-1].Name
          }
          Write-Host "Using toolset $ts"
          "TOOLSET=$ts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCVARSALL=$vs\VC\Auxiliary\Build\vcvarsall.bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: cmd
        run: |
          if not exist "%LOG_DIR%" mkdir "%LOG_DIR%"
          if not exist "%OBJ_DIR%" mkdir "%OBJ_DIR%"
          cd src
          if defined WINSDK goto winsdk
          call ..\sdk\phpsdk-${{ matrix.starter }}-x64.bat -s %TOOLSET% -t ..\ci-root\ci\build_task.bat
          goto built
          :winsdk
          rem the SDK starter cannot pass a Windows SDK version to vcvarsall: set up its shell here
          set "VSCMD_START_DIR=%CD%"
          set "__VSCMD_ARG_NO_LOGO=yes"
          echo vcvarsall amd64 %WINSDK% -vcvars_ver=%TOOLSET%
          cmd /c ""%VCVARSALL%" amd64 %WINSDK% -vcvars_ver=%TOOLSET% && ..\sdk\bin\phpsdk_setvars.bat && ..\ci-root\ci\build_task.bat"
          :built
          if %errorlevel% neq 0 exit /b 1
          dir /s /b "%OBJ_DIR%\php.exe" || (echo no php.exe was built & exit /b 1)

      - name: Checks and tests
        if: success() || failure()
        shell: pwsh
        run: >
          python ci-root/ci/checks.py --src "${{ github.workspace }}\src" --obj "$env:OBJ_DIR"
          --release ${{ matrix.release }} --ts ${{ matrix.ts }} --side ${{ matrix.side }}
          --out "$env:LOG_DIR" --log "$env:LOG_DIR\nmake.log"

      - name: Upload results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.release }}-${{ matrix.ts }}-${{ matrix.side }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Summary
    needs: build
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: result-*
      - name: Compare patched with unpatched builds
        run: python3 ci/summary.py results
      - name: Upload summary
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            results/summary.md
            results/summary.json
